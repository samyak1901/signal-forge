services:
  postgres:
    image: postgres:17-alpine
    container_name: signal-forge-postgres
    environment:
      POSTGRES_DB: signal_forge
      POSTGRES_PASSWORD: signal_forge
      POSTGRES_USER: signal_forge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal_forge -d signal_forge"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: signal-forge-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: signal-forge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
  postgres-data:
  qdrant-data:
